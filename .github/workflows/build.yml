name: Build

on:
  push:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - ".github/**"
      - "LICENSE"
      - "*.txt"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - ".github/**"
      - "LICENSE"
      - "*.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Download Windows tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\download-windows-tools.ps1

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (debug)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.os }}
          path: dist/
          retention-days: 7

      - name: Upload Tauri binary (debug)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-binary-debug-${{ matrix.os }}
          path: |
            src-tauri/target/debug/vcam_client
            src-tauri/target/debug/vcam_client.exe
          retention-days: 7
