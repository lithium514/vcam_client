name: Build

on:
  push:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - ".github/**"
      - "LICENSE"
      - "*.txt"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - ".github/**"
      - "LICENSE"
      - "*.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build frontend
        run: npm run build

      - name: Build Tauri (Rust)
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

      - name: Upload Tauri binary (debug)
        uses: actions/upload-artifact@v4
        with:
          name: tauri-binary-debug
          path: src-tauri/target/debug/vcam_client
          retention-days: 7
