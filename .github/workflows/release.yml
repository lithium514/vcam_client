name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Download Windows tools
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\scripts\download-windows-tools.ps1

      - name: Build Tauri app (release)
        run: npm run tauri build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            src-tauri/target/release/vcam_client
            src-tauri/target/release/vcam_client.exe
            src-tauri/target/release/bundle/**
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: ${{ matrix.os == 'ubuntu-latest' }}
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/vcam_client
            src-tauri/target/release/vcam_client.exe
            src-tauri/target/release/bundle/**
